# Harness-neutral Docker snapshots for generated medicine tasks.
#
# Each image is built from a clean ALE runtime, desktop, or DinD base. Task
# data, hidden references, and the selected agent harness are injected by the
# runner and are never baked into these images. Keep image IDs locked here so a
# reused tag cannot silently change a task's execution environment.
